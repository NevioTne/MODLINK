<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MODLINK</title>
<meta name="description" content="MODLINK combines custom hardware with dedicated PC software to create a versatile desktop companion.">
<meta property="og:type" content="website">
<meta property="og:title" content="MODLINK">
<meta property="og:description" content="Custom hardware and dedicated PC software that work together as one system.">
<!-- TODO: add og:image (relative or absolute URL) once you have a device image -->
<meta name="theme-color" content="#070c15">
<link rel="icon" href="assets/icons/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="prog" aria-hidden="true"></div><div id="glow" aria-hidden="true"></div>
<a class="skip" href="#main" data-i18n="skip"></a>
<header class="top">
  <a class="logo" href="#top" aria-label="MODLINK"><span class="mk">M</span><span class="name">MODLINK</span></a>
  <button id="menuBtn" class="icon-btn menu" aria-expanded="false" aria-controls="nav" data-aria="menu"><span></span><span></span><span></span></button>
  <nav id="nav" aria-label="Main">
    <a href="#overview" data-i18n="nav_overview"></a><a href="#features" data-i18n="nav_features"></a><a href="#hardware" data-i18n="nav_hardware"></a><a href="#software" data-i18n="nav_software"></a><a href="#comm" data-i18n="nav_comm"></a><a href="#gallery" data-i18n="nav_gallery"></a><a href="#docs" data-i18n="nav_docs"></a><a data-link="repoUrl" data-i18n="nav_github"></a>
    <span class="tools"><button id="langBtn" class="pill" data-aria="lang"></button><button id="themeBtn" class="pill" data-aria="theme">◐</button></span>
  </nav>
</header>
<main id="main">
<section class="hero" id="top">
  <canvas id="fxc" aria-hidden="true"></canvas>
  <div class="wrap hero-grid">
    <div class="hero-copy">
      <h1 class="name">MODLINK</h1>
      <p class="tag" data-i18n="hero_title"></p>
      <p class="lead" data-i18n="hero_text"></p>
      <p class="actions"><a class="btn primary" href="#features" data-i18n="btn_features"></a><a class="btn" data-link="repoUrl" data-i18n="btn_github"></a></p>
    </div>
    <div class="simdev">
      <div class="devrow">
        <div id="simBody" class="devbody" tabindex="0" role="application" aria-label="MODLINK simulator"><canvas id="simCanvas" aria-hidden="true"></canvas></div>
        <div class="pad">
          <div id="knob" class="knob" tabindex="0" role="slider" aria-valuemin="0" aria-valuemax="0" aria-valuenow="0" data-aria="sim_knob"><span class="grip"></span><i class="mark"></i></div>
          <div class="tbtns"><button id="bK" class="tbtn" data-i18n="sim_btn"></button><button id="bP" class="tbtn" data-i18n="sim_push"></button></div>
        </div>
      </div>
      <p class="muted small" data-i18n="sim_hint"></p>
    </div>
  </div>
  <div class="wrap simdock">
    <div class="panel"><h3 data-i18n="sim_pc_h"></h3>
        <label class="fld"><input type="checkbox" id="simPc" checked><span data-i18n="sim_pc_on"></span></label>
        <label class="fld"><input type="checkbox" id="simGame"><span data-i18n="sim_game"></span></label>
        <label class="fld"><input type="checkbox" id="simUsb"><span data-i18n="sim_usb"></span></label>
        <button id="simCopy" class="btn" data-i18n="sim_copy"></button>
        <label class="fld"><input type="number" id="simMod" min="0" max="63" value="0"><span data-i18n="sim_mod"></span></label>
        <p class="muted small" data-i18n="sim_demo"></p></div>
    <div class="panel"><h3 data-i18n="sim_mon_h"></h3><p class="muted small" data-i18n="sim_mon_p"></p><ul id="mon" class="mon"></ul></div>
  </div>
</section>
<div class="marquee" aria-hidden="true"><div class="mtrack" id="marq"></div></div>
<section class="stats"><div class="wrap" id="stats"></div></section>

<section id="overview"><div class="wrap">
  <h2 data-i18n="ov_h"></h2><p data-i18n="ov_1"></p>
  <div class="triad">
    <div class="tcard"><svg viewBox="0 0 120 90" aria-hidden="true"><rect class="st" x="14" y="4" width="92" height="82" rx="12"/><rect class="fl" x="22" y="12" width="76" height="40" rx="5" opacity=".12"/>
      <rect class="fl tl" style="--i:0" x="26" y="16" width="20" height="13" rx="3"/><rect class="fl tl" style="--i:1" x="50" y="16" width="20" height="13" rx="3"/><rect class="fl tl" style="--i:2" x="74" y="16" width="20" height="13" rx="3"/><rect class="fl tl" style="--i:3" x="26" y="33" width="20" height="13" rx="3"/><rect class="fl tl" style="--i:4" x="50" y="33" width="20" height="13" rx="3"/><rect class="fl tl" style="--i:5" x="74" y="33" width="20" height="13" rx="3"/><circle class="st rotc" cx="60" cy="70" r="9"/></svg><b data-i18n="cm_dev"></b></div>
    <div class="tlink"><div class="lane up"><i></i><i></i><i></i></div><div class="lane down"><i></i><i></i><i></i></div></div>
    <div class="tcard"><svg viewBox="0 0 120 90" aria-hidden="true"><rect class="st" x="8" y="6" width="104" height="78" rx="9"/><path class="st" d="M8 22h104"/><circle class="fl" cx="18" cy="14" r="3"/>
      <rect class="fl sb" style="--i:0" x="18" y="30" width="70" height="5" rx="2.5"/><rect class="fl sb" style="--i:1" x="18" y="40" width="52" height="5" rx="2.5"/><rect class="fl sb" style="--i:2" x="18" y="50" width="84" height="5" rx="2.5"/><polyline class="st spl" pathLength="1" points="18,74 36,66 52,70 70,58 88,62 102,50"/></svg><b data-i18n="cm_pc"></b></div>
  </div>
  <p id="ov4" class="muted small"></p>
</div></section>

<section id="features" class="alt"><div class="wrap">
  <h2 data-i18n="ft_h"></h2><ul id="featureList" class="grid"></ul>
<div id="storage" class="stor">
    <h3 class="sub" data-i18n="st_h"></h3><p data-i18n="st_lead"></p>
    <div class="two"><div class="panel"><h4 data-i18n="st_ov_h"></h4><ul id="drives" class="drives"></ul><p class="muted small" data-i18n="st_ex"></p></div>
    <div class="panel"><h4 data-i18n="st_dev_h"></h4><p data-i18n="st_dev_p"></p><ul id="stDev" class="tick"></ul><p class="muted small" data-i18n="st_dev_note"></p></div></div>
    <h4 class="sub2" data-i18n="st_an_h"></h4><p data-i18n="st_an_p"></p><ul id="modes" class="grid cols2"></ul>
    <div class="two"><div class="panel"><h4 data-i18n="st_prog_h"></h4><p data-i18n="st_prog_p"></p><p class="muted small" data-i18n="st_prog_note"></p></div>
    <div class="panel"><div id="progMock" class="mock"></div><p class="muted small" data-i18n="st_ex"></p></div></div>
    <div class="two"><div class="panel"><h4 data-i18n="st_res_h"></h4><p data-i18n="st_res_p"></p></div><ul id="stRes" class="tiles"></ul></div>
    <h4 class="sub2" data-i18n="st_pc_h"></h4>
    <div class="two"><div class="panel"><h4 data-i18n="st_pc_dup_h"></h4><ul id="pcDup" class="tick"></ul></div><div class="panel"><h4 data-i18n="st_pc_big_h"></h4><ul id="pcBig" class="tick"></ul></div></div>
    <p class="callout" data-i18n="st_nodel"></p>
    <div class="two"><div class="panel"><h4 data-i18n="st_bin_h"></h4><p data-i18n="st_bin_p"></p></div>
    <div class="panel"><h4 data-i18n="st_team_h"></h4><p data-i18n="st_team_p"></p><ul id="stTeam" class="tick"></ul><p class="muted small"><span data-i18n="st_dl"></span> <a href="#software" data-i18n="nav_software"></a></p></div></div>
  </div>
</div></section>

<section id="hardware"><div class="wrap split">
  <div><h2 data-i18n="hw_h"></h2><p data-i18n="hw_p"></p></div>
  <ul id="hwList" class="tiles2"></ul>
</div></section>

<section id="software" class="alt"><div class="wrap split">
  <div><h2 data-i18n="sw_h"></h2><p class="tag2" data-i18n="studio_sub"></p><p data-i18n="sw_p"></p><p class="muted small" id="stuVer"></p>
    <div class="panel"><h3 data-i18n="dl_h"></h3><p data-i18n="dl_p"></p><a class="btn primary" data-link="downloadUrl" data-i18n="dl_btn"></a></div></div>
  <ul id="swList" class="tiles2"></ul>
</div></section>

<section id="studio"><div class="wrap">
  <h2 data-i18n="studio_h"></h2><p data-i18n="studio_lead"></p><p class="muted small" data-i18n="studio_note"></p>
  <div id="studioBlocks"></div>
  <h3 class="sub" data-i18n="stu_table_h"></h3><div class="scroll"><table class="specs coop"><thead id="coopHead"></thead><tbody id="coopRows"></tbody></table></div>
  <div class="panel" style="margin-top:32px"><h3 data-i18n="stu_smart_h"></h3><p data-i18n="stu_smart_p"></p><ul id="smartList" class="tick"></ul></div>
  <h3 class="sub" data-i18n="dev_h"></h3><p data-i18n="dev_p"></p><ul id="devCards" class="grid"></ul>
</div></section>

<section id="comm" class="alt"><div class="wrap">
  <h2 data-i18n="cm_h"></h2><p data-i18n="cm_lead"></p><p class="muted small" data-i18n="cm_status_note"></p>
  <div id="arch" class="arch">
    <div class="node"><b data-i18n="cm_dev"></b><ul id="devTasks"></ul></div>
    <div class="link"><span class="ln" data-i18n="cm_serial"></span><div class="lane up"><i></i><i></i><i></i></div><div class="lane down"><i></i><i></i><i></i></div><small>115200 baud · JSON</small></div>
    <div class="node"><b data-i18n="cm_pc"></b><ul id="pcTasks"></ul></div>
  </div>
  <div class="dirs"><div class="dir up"><h3 data-i18n="cm_up_h"></h3><ul id="upList"></ul></div><div class="dir down"><h3 data-i18n="cm_down_h"></h3><ul id="downList"></ul></div></div>
    <h3 class="sub" data-i18n="cm_explore"></h3>
  <div id="tabs" role="tablist" class="chips"></div><div id="tabPanel" role="tabpanel" class="panel tabp" tabindex="0"></div>
  <div class="two">
    <div class="panel"><h3 data-i18n="cm_mod_h"></h3><p data-i18n="cm_mod_p"></p><div id="modBtns" class="chips"></div><p id="modDesc" aria-live="polite"></p><div id="bits" class="bits"></div><p class="muted small"><span id="modId"></span> · <span data-i18n="cm_mod_ex"></span></p></div>
    <div class="panel"><h3 data-i18n="cm_diag_h"></h3><div id="diagBtns" class="chips"></div><p id="diagDesc" aria-live="polite"></p><p class="muted small" data-i18n="cm_diag_note"></p></div>
  </div>
  <h3 class="sub" data-i18n="cm_spec_h"></h3><div class="scroll"><table class="specs"><tbody id="specs"></tbody></table></div>
  <h3 class="sub" data-i18n="cm_rel_h"></h3><ul id="relList" class="grid"></ul>
</div></section>

<section id="gallery"><div class="wrap">
  <h2 data-i18n="gal_h"></h2><p data-i18n="gal_p"></p><ul id="galGrid" class="gallery"></ul>
</div></section>

<section id="docs" class="alt"><div class="wrap">
  <h2 data-i18n="doc_h"></h2><p data-i18n="doc_p"></p><ul id="docList" class="docs"></ul>
</div></section>

<section id="github"><div class="wrap"><div class="gh">
  <h2 data-i18n="gh_h"></h2><p data-i18n="gh_p"></p>
  <p class="actions"><a class="btn primary" data-link="repoUrl" data-i18n="b_repo"></a><a class="btn" data-link="downloadUrl" data-i18n="b_dl"></a><a class="btn" data-link="releasesUrl" data-i18n="b_rel"></a></p>
</div></div></section>
</main>
